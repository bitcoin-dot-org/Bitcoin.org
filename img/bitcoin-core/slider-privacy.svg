    <circle cx="74" cy="152" r="10"/>
    <circle cx="516" cy="52" r="10"/>
    <circle cx="526" cy="152" r="12"/>
  </g>

  <!-- o escudo -->
  <path d="M300 28 L378 52 L378 112 Q378 158 300 180 Q222 158 222 112 L222 52 Z" fill="url(#navy)" stroke="#dfe5ec" stroke-width="6"/>

