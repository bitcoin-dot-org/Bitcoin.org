<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-labelledby="t">
  <title id="t">Bitcoin Core requirements and warnings</title>
  <defs>
    <linearGradient id="org" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f7931a"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a5f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#102a43" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- constellation: a malha das heros do site, em cinza leve -->
  <g stroke="#c9d3e0" stroke-width="1" opacity="0.55">
    <line x1="40"  y1="150" x2="120" y2="60"/>
    <line x1="120" y1="60"  x2="215" y2="120"/>
    <line x1="480" y1="46"  x2="392" y2="112"/>
    <line x1="480" y1="46"  x2="560" y2="128"/>
    <line x1="392" y1="112" x2="452" y2="170"/>
  </g>
  <g fill="#aeb9c9">
    <circle cx="40"  cy="150" r="3"/><circle cx="120" cy="60"  r="4"/>
    <circle cx="215" cy="120" r="3"/><circle cx="480" cy="46"  r="4"/>
    <circle cx="560" cy="128" r="3"/><circle cx="392" cy="112" r="3"/>
    <circle cx="452" cy="170" r="3"/>
  </g>

  <!-- esquerda: barras de recursos (disco/memória/banda) -->
  <g filter="url(#soft)">
    <rect x="92"  y="120" width="24" height="48" rx="6" fill="url(#org)" opacity="0.45"/>
    <rect x="128" y="96"  width="24" height="72" rx="6" fill="url(#org)" opacity="0.7"/>
    <rect x="164" y="64"  width="24" height="104" rx="6" fill="url(#org)"/>
  </g>
  <line x1="84" y1="172" x2="196" y2="172" stroke="#c9d3e0" stroke-width="3" stroke-linecap="round"/>

  <!-- centro: escudo -->
  <g filter="url(#soft)">
    <path d="M300 26 L370 50 V108 C370 148 338 170 300 182 C262 170 230 148 230 108 V50 Z"
          fill="url(#navy)"/>
    <path d="M300 40 L356 60 V108 C356 138 332 156 300 167 C268 156 244 138 244 108 V60 Z"
          fill="none" stroke="url(#org)" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="292" y="72" width="16" height="48" rx="8" fill="url(#org)"/>
    <circle cx="300" cy="140" r="10" fill="url(#org)"/>
  </g>

  <!-- direita: medidor -->
  <g filter="url(#soft)">
    <path d="M424 168 A80 80 0 0 1 584 168" fill="none" stroke="#dfe5ec" stroke-width="13" stroke-linecap="round"/>
    <path d="M424 168 A80 80 0 0 1 546 100" fill="none" stroke="url(#org)" stroke-width="13" stroke-linecap="round"/>
    <line x1="504" y1="168" x2="546" y2="120" stroke="#102a43" stroke-width="6" stroke-linecap="round"/>
    <circle cx="504" cy="168" r="11" fill="#102a43"/>
    <circle cx="504" cy="168" r="4" fill="#ffffff"/>
  </g>
</svg>
